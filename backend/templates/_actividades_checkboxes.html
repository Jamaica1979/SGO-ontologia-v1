{% if posiciones %}
<div>
  <label>Posición <span class="meta">(opcional — si no elegís, vale para cualquier posición del puesto)</span></label>
  <select name="etapa"><option value="">— cualquier posición —</option>
    {% for x in posiciones %}<option value="{{ x.clave }}">{{ x.nombre }}</option>{% endfor %}</select>
</div>
{% endif %}
{% if actividades %}
<div id="bloque-origen" onchange="contarSueltas(this)">
  <div class="meta" style="display:flex;justify-content:space-between;align-items:center;margin:4px 0">
    <span class="contador">Marcaste 0 de {{ actividades|length }} · quedan {{ actividades|length }} sin marcar</span>
    <span><a href="#" onclick="marcarTodasSueltas(document.getElementById('bloque-origen'), true); return false;">marcar todas</a> ·
      <a href="#" onclick="marcarTodasSueltas(document.getElementById('bloque-origen'), false); return false;">ninguna</a></span>
  </div>
  <div class="checklist">
    {% for a in actividades %}
    <label class="check-row"><input type="checkbox" name="actividad_ids" value="{{ a.id }}">
      <span>{{ a.codigo }} — {{ a.descripcion }}{% if a.posicion %} <span class="tag warn">{{ pos_nombre(a.puesto_codigo, a.posicion) }}</span>{% endif %}
        <span class="meta">· hoy: {% if hoy.get(a.id) %}{{ hoy[a.id] }}{% else %}<b style="color:var(--crit)">sin responsable</b>{% endif %}</span></span></label>
    <input type="hidden" name="todas_ids" value="{{ a.id }}">
    {% endfor %}
  </div>
  <label style="margin-top:10px;display:block">Las que no marques: ¿a quién se las asignás? <span class="meta">(opcional — alcanza a las que hoy lleva el titular o nadie, no a las que ya tomó otra persona)</span></label>
  <select name="resto_persona_id">
    <option value="">Dejarlas como están</option>
    {% for p in personas %}<option value="{{ p.id }}">{{ p.nombre_completo }}</option>{% endfor %}
  </select>
</div>
{% elif puesto_codigo %}
<p class="empty">Ese puesto no tiene actividades cargadas.</p>
{% endif %}
