<div class="modo-toggle">
  <label>
    <input type="radio" name="modo_cobertura" value="puesto" {% if modo_default|default('puesto') == 'puesto' %}checked{% endif %}
           onchange="document.getElementById('modo-puesto').style.display='block'; document.getElementById('modo-sueltas').style.display='none';">
    Puesto completo
  </label>
  <label>
    <input type="radio" name="modo_cobertura" value="sueltas" {% if modo_default|default('puesto') == 'sueltas' %}checked{% endif %}
           onchange="document.getElementById('modo-puesto').style.display='none'; document.getElementById('modo-sueltas').style.display='block';">
    Actividades sueltas de otro puesto
  </label>
</div>

<div id="modo-puesto" style="display:{{ 'none' if modo_default|default('puesto') == 'sueltas' else 'block' }}">
  <form class="inline" hx-post="/ui/personas/{{ persona.id }}/asignaciones/nueva" hx-target="#nueva-asignacion" hx-swap="innerHTML">
    <label>Puesto</label>
    <select name="puesto_codigo" required onchange="sgoPosiciones(this)">
      <option value="">-- elegir puesto --</option>
      {% for p in puestos %}<option value="{{ p.codigo }}" data-posiciones='{{ (posiciones_por_puesto or {}).get(p.codigo, [])|tojson }}'>{{ p.codigo }} — {{ p.nombre }}</option>{% endfor %}
    </select>
    <div class="posicion-wrap" style="display:none">
      <label>Posición <span class="meta">(este puesto tiene posiciones: elegí cuál ocupa)</span></label>
      <select name="etapa"></select>
    </div>
    <label>Planta</label>
    <select name="planta_id" required>
      {% for pl in plantas %}<option value="{{ pl.id }}">{{ pl.nombre }} ({{ pl.estado }})</option>{% endfor %}
    </select>
    <div class="actions"><button type="submit" class="primary">Asignar</button></div>
  </form>
</div>

<div id="modo-sueltas" style="display:{{ 'block' if modo_default|default('puesto') == 'sueltas' else 'none' }}">
  {% if error_sueltas %}<p class="error">{{ error_sueltas }}</p>{% endif %}
  <form class="inline" hx-post="/ui/personas/{{ persona.id }}/actividades-sueltas/nueva" hx-target="#nueva-asignacion" hx-swap="innerHTML">
    <label>Puesto de origen (de dónde vienen las actividades)</label>
    <select name="puesto_codigo" required
            hx-get="/ui/personas/{{ persona.id }}/actividades-de-puesto" hx-include="this"
            hx-target="#actividades-checkbox-list" hx-swap="innerHTML" hx-trigger="change">
      <option value="">-- elegir puesto --</option>
      {% for p in puestos %}<option value="{{ p.codigo }}">{{ p.codigo }} — {{ p.nombre }}</option>{% endfor %}
    </select>

    <div id="actividades-checkbox-list"></div>

    <label>Planta</label>
    <select name="planta_id" required>
      {% for pl in plantas %}<option value="{{ pl.id }}">{{ pl.nombre }} ({{ pl.estado }})</option>{% endfor %}
    </select>
    <div class="actions"><button type="submit" class="primary">Asignar actividades sueltas</button></div>
  </form>
</div>

<script>
// v3.9: el selector de posición aparece sólo si el puesto elegido tiene posiciones
function sgoPosiciones(sel) {
  const form = sel.closest('form');
  const wrap = form.querySelector('.posicion-wrap');
  const destino = wrap.querySelector('select');
  const opt = sel.options[sel.selectedIndex];
  let pos = [];
  try { pos = JSON.parse(opt.dataset.posiciones || '[]'); } catch (e) { pos = []; }
  destino.innerHTML = '';
  pos.forEach(([clave, nombre]) => { const o = document.createElement('option'); o.value = clave; o.textContent = nombre; destino.appendChild(o); });
  wrap.style.display = pos.length ? 'block' : 'none';
  destino.required = pos.length > 0;
  destino.disabled = pos.length === 0;
}
</script>
