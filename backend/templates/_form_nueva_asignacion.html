<form class="inline" hx-post="/ui/personas/{{ persona.id }}/asignaciones/nueva" hx-target="#nueva-asignacion" hx-swap="innerHTML">
  <label>Puesto</label>
  <select name="puesto_codigo" required onchange="document.getElementById('etapa-wrap').style.display = (this.value==='PRD-04'||this.value==='PRD-05') ? 'block':'none'">
    <option value="">-- elegir puesto --</option>
    {% for p in puestos %}<option value="{{ p.codigo }}">{{ p.codigo }} — {{ p.nombre }}</option>{% endfor %}
  </select>
  <div id="etapa-wrap" style="display:none">
    <label>Etapa (Trituración y Carga y Acarreo tienen línea primaria y secundaria a la vez)</label>
    <select name="etapa"><option value="primaria">Primaria</option><option value="secundaria">Secundaria</option></select>
  </div>
  <label>Planta</label>
  <select name="planta_id" required>
    {% for pl in plantas %}<option value="{{ pl.id }}">{{ pl.nombre }} ({{ pl.estado }})</option>{% endfor %}
  </select>
  <div class="actions"><button type="submit" class="primary">Asignar</button></div>
</form>
